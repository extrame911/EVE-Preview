name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EVE-Preview.sln

      - name: Build
        run: dotnet build EVE-Preview.sln -c Release --no-restore -warnaserror

      - name: Test
        shell: pwsh
        run: |
          dotnet test EVE-Preview.sln -c Release --no-build --logger "console;verbosity=normal" *> test-output.log
          $testExitCode = $LASTEXITCODE
          "## Test output" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content test-output.log -Tail 250 | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $testExitCode

      - name: Publish single-file application
        run: dotnet publish src/EVE-Preview.App/EVE-Preview.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/EVE-Preview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/SHA256SUMS.txt -Value "$hash *EVE-Preview.exe" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## Changes

          - Fixed client window layout restoration near negative-coordinate monitor seams by applying saved native bounds from a system-aware DPI context.
          - Removed the ineffective repeated layout correction; layout application now submits once and validates the resulting window rectangle.
          - Fixed the preview start/stop button and tooltip so both follow the current runtime state.
          - Fixed a cross-thread WPF CollectionView error when stopping previews.
          - Added an always-visible Overview scrollbar and a compact "Preview off" status state with a muted colour.
          - Reduced client-card height and removed the empty gap above the status line.

          ## Verification

          - Release build with warnings treated as errors: passed.
          - Automated tests: 319 passed, 0 failed.
          - DESIGN.md validation: passed locally.
          - Verified applying a saved (-11, 0, 2586 × 1511) client window restores a 2560 × 1440 client area.

          ## Download

          `EVE-Preview.exe` is a self-contained Windows x64 single-file build. No .NET installation is required. Verify the download with `SHA256SUMS.txt`.
          '@
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "EVE-Preview $env:GITHUB_REF_NAME" --notes $notes artifacts/EVE-Preview.exe artifacts/SHA256SUMS.txt
