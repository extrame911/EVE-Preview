name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EVE-Preview.sln

      - name: Build
        run: dotnet build EVE-Preview.sln -c Release --no-restore -warnaserror

      - name: Test
        shell: pwsh
        run: |
          dotnet test EVE-Preview.sln -c Release --no-build --logger "console;verbosity=normal" *> test-output.log
          $testExitCode = $LASTEXITCODE
          "## Test output" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content test-output.log -Tail 250 | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $testExitCode

      - name: Publish single-file application
        run: dotnet publish src/EVE-Preview.App/EVE-Preview.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/EVE-Preview.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/SHA256SUMS.txt -Value "$hash *EVE-Preview.exe" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## Changes

          - Removed the unused pause/resume API and `Paused` service state.
          - Separated the always-on client control plane from thumbnail rendering.
          - Client hotkeys, cycle groups, window layouts and bulk window actions now use the client registry directly instead of depending on preview windows.
          - Stopping previews now disposes only thumbnails and overlays; process discovery, hotkeys, cycle groups and the window-operation queue remain active.
          - Starting previews again recreates thumbnails from the current client registry.
          - Three-part version numbers and the status-bar version display remain in place.

          ## Verification

          - Release build with warnings treated as errors: passed.
          - Automated tests: 321 passed, 0 failed.
          - DESIGN.md validation: passed locally.
          - Verified cycle-group hotkey Ctrl+Q still activates an EVE client while thumbnails are stopped.

          ## Download

          `EVE-Preview.exe` is a self-contained Windows x64 single-file build. No .NET installation is required. Verify the download with `SHA256SUMS.txt`.
          '@
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "EVE-Preview $env:GITHUB_REF_NAME" --notes $notes artifacts/EVE-Preview.exe artifacts/SHA256SUMS.txt
