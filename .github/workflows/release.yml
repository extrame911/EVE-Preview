name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EVE-Preview.sln

      - name: Build
        run: dotnet build EVE-Preview.sln -c Release --no-restore -warnaserror

      - name: Test
        shell: pwsh
        run: |
          dotnet test EVE-Preview.sln -c Release --no-build --logger "console;verbosity=normal" *> test-output.log
          $testExitCode = $LASTEXITCODE
          "## Test output" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content test-output.log -Tail 250 | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $testExitCode

      - name: Publish folder build
        run: dotnet publish src/EVE-Preview.App/EVE-Preview.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/folder

      - name: Publish single-file build
        run: dotnet publish src/EVE-Preview.App/EVE-Preview.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/single

      - name: Package release archives and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/folder/* -DestinationPath artifacts/EVE-Preview-folder.zip -CompressionLevel Optimal
          Compress-Archive -Path artifacts/single/EVE-Preview.exe -DestinationPath artifacts/EVE-Preview-single.zip -CompressionLevel Optimal
          $folderHash = (Get-FileHash artifacts/EVE-Preview-folder.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $singleHash = (Get-FileHash artifacts/EVE-Preview-single.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$folderHash *EVE-Preview-folder.zip",
            "$singleHash *EVE-Preview-single.zip"
          ) | Set-Content -Path artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          ## Changes

          - Release assets now include both the self-contained folder build and the single-file build as ZIP archives.
          - Added checksums for both release archives.
          - Removed the pause/resume API and separated the always-on client control plane from thumbnail rendering.
          - Client hotkeys, cycle groups, window layouts and bulk window actions now use the client registry directly.
          - Stopping previews disposes only thumbnails and overlays while process discovery, hotkeys, cycle groups and the window-operation queue remain active.

          ## Verification

          - Release build with warnings treated as errors: passed.
          - Automated tests: 321 passed, 0 failed.
          - DESIGN.md validation: passed locally.
          - Verified cycle-group hotkey Ctrl+Q still activates an EVE client while thumbnails are stopped.

          ## Download

          - `EVE-Preview-folder.zip`: folder build with runtime dependencies.
          - `EVE-Preview-single.zip`: self-contained single-file build.
          - `SHA256SUMS.txt`: SHA-256 checksums for both archives.

          No .NET installation is required.
          '@
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "EVE-Preview $env:GITHUB_REF_NAME" --notes $notes artifacts/EVE-Preview-folder.zip artifacts/EVE-Preview-single.zip artifacts/SHA256SUMS.txt
